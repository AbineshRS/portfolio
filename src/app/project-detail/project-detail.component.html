@if (project; as proj) {
  <div class="project-detail section">
    <p class="project-detail-breadcrumb">Keesa Express</p>
    <h1 class="project-detail-title">{{ proj.name }}</h1>
    <div class="project-detail-description card">
      @if (proj.points?.length) {
        <ul class="project-detail-points">
          @for (point of proj.points; track point) {
            <li>{{ point }}</li>
          }
        </ul>
      } @else {
        <p>{{ proj.description }}</p>
      }
    </div>
    @if (proj.liveUrl) {
      <a [href]="proj.liveUrl" target="_blank" rel="noopener" class="project-detail-live-btn btn-primary">
        View live website
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
        </svg>
      </a>
    }
  </div>
} @else {
  <div class="project-detail section">
    <p class="project-detail-notfound">Project not found.</p>
  </div>
}
